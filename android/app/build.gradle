plugins {
    id "com.android.application"
}

android {
    namespace "studio.nova.runtime"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "studio.nova.runtime"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DBUILD_TESTING=OFF",
                    "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                    "-DNOVA_LICENSE_DIRECTORY=${file('build/generated/novaAssets/licenses').absolutePath}"
                targets "nova_runtime"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }
    sourceSets {
        main {
            assets.srcDirs = ["build/generated/novaExamples", "build/generated/novaAssets"]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.register("prepareNovaExamples", Sync) {
    from("../../examples")
    into(layout.buildDirectory.dir("generated/novaExamples/examples"))
}

// Dependency notices are emitted by CMake and must exist before assets are packaged.
tasks.configureEach {
    if (name == "mergeDebugAssets") dependsOn("prepareNovaExamples", "externalNativeBuildDebug")
    if (name == "mergeReleaseAssets") dependsOn("prepareNovaExamples", "externalNativeBuildRelease")
}
