plugins {
    id "com.android.application"
}

def exportPath = providers.gradleProperty("novaExportDirectory").orNull
def exportDirectory = exportPath == null ? null : file(exportPath)
def exportConfig = null
if (exportDirectory != null) {
    exportConfig = new groovy.json.JsonSlurper().parse(new File(exportDirectory, "export.json"))
    if (exportConfig.format != "nova-export-stage" || exportConfig.version != 1) {
        throw new GradleException("Unsupported Nova export stage; use scripts/export-apk.py stage")
    }
    layout.buildDirectory.set(new File(exportDirectory, "android-build"))
}

android {
    namespace "studio.nova.runtime"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId exportConfig == null ? "studio.nova.runtime" : exportConfig.config.applicationId
        minSdk 26
        targetSdk 33
        versionCode exportConfig == null ? 1 : exportConfig.config.versionCode
        versionName exportConfig == null ? "0.1.0" : exportConfig.config.versionName
        resValue "string", "nova_app_name", exportConfig == null ? "Nova Studio" : exportConfig.config.displayName
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DBUILD_TESTING=OFF",
                    "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                    "-DNOVA_LICENSE_DIRECTORY=${layout.buildDirectory.dir('generated/novaAssets/licenses').get().asFile.absolutePath}",
                    "-DNOVA_STANDALONE=${exportConfig == null ? 'OFF' : 'ON'}",
                    "-DNOVA_WORLD_RESOLUTION=${exportConfig == null ? '960x540' : exportConfig.config.get('worldResolution', '960x540')}"
                targets "nova_runtime"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
            if (exportDirectory != null) {
                buildStagingDirectory new File(exportDirectory, "native-build")
            }
        }
    }
    sourceSets {
        main {
            assets.srcDirs = [layout.buildDirectory.dir("generated/novaExamples"),
                layout.buildDirectory.dir("generated/novaAssets")]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.register("prepareNovaExamples", Sync) {
    if (exportDirectory == null) {
        from("../../examples") { into("examples") }
    } else {
        from(new File(exportDirectory, "assets/game")) { into("game") }
    }
    into(layout.buildDirectory.dir("generated/novaExamples"))
}

// Dependency notices are emitted by CMake and must exist before assets are packaged.
tasks.configureEach {
    if (name == "mergeDebugAssets") dependsOn("prepareNovaExamples", "externalNativeBuildDebug")
    if (name == "mergeReleaseAssets") dependsOn("prepareNovaExamples", "externalNativeBuildRelease")
    if (name.toLowerCase().contains("lint") && name.contains("Release")) {
        dependsOn("prepareNovaExamples", "externalNativeBuildRelease")
    }
    if (name.toLowerCase().contains("lint") && name.contains("Debug")) {
        dependsOn("prepareNovaExamples", "externalNativeBuildDebug")
    }
}
