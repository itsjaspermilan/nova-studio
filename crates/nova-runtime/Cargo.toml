[package]
name = "nova-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Nova's native game runtime (wgpu renderer, Lua gameplay, audio)"
build = "build.rs"

[lints]
workspace = true

[lib]
name = "nova_runtime"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
fontdue = "0.9.5"
glam = { version = "0.34.2", features = ["bytemuck"] }
gltf = "1.4.1"
hound = "3.5.1"
log = "0.4.35"
mlua = { version = "0.12.2", features = ["lua54", "serialize", "vendored"] }
png = "0.18.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = "30.0.1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[build-dependencies]
cc = "1.11.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11.11"
gilrs = "0.11.2"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15.1"
