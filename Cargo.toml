[workspace]
resolver = "3"
members = ["crates/*", "studio/src-tauri"]

# winit 0.30.13 with one change (see vendor/winit/NOVA-PATCH.md): analogue sticks and triggers on Android.
[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds (cargo test, cargo build) carry line tables, so backtraces still show file and line, but no per-variable debug info, and none at all
# for dependencies: the full info made target/debug 34 GB. Set debug = true here when stepping through code in a debugger.
# Tests play whole games for thousands of frames: the engine lightly optimised and its dependencies fully (built once) halve the test runs.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# For tools and quick iteration (scripts/build-apk.sh --fast, the host `nova` that packs APKs): the same optimisation level but no link-time
# optimisation, many codegen units and incremental builds, so a one-file engine edit rebuilds in seconds, not a minute. A bit slower at run time:
# use the release profile for any measurement on the device.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
