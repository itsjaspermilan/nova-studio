[workspace]
resolver = "3"
members = ["crates/*", "studio/src-tauri"]

# winit 0.30.13 with one change (see vendor/winit/NOVA-PATCH.md): analogue sticks and triggers on Android.
[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
